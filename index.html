<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>His Place Community Church</title>
    <meta name="description" content="His Place Community Church is a Bible based, Jesus following church serving Amelia, Beechmont, Cherry Grove, Bethel, and the State Route 125 area." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Favicon. Place the referenced files in the /public folder — Vite serves
         anything in /public from the site root, so /favicon.png maps to
         public/favicon.png. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Canonical URL. Update the domain here if it ever changes. -->
    <link rel="canonical" href="https://www.hpcchurch.church/" />

    <!-- Open Graph defaults (used when a page is shared on Facebook, iMessage,
         Slack, etc.). App.jsx overrides og:title and og:description per page
         at runtime; og:image and og:url stay the same across the site unless
         you add per-page images later. -->
    <meta property="og:site_name" content="His Place Community Church" />
    <meta property="og:title" content="His Place Community Church" />
    <meta property="og:description" content="A Bible based, Jesus following church serving Amelia, Beechmont, Cherry Grove, Bethel, and the State Route 125 area. Join us Sundays at 11:00 AM." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hpcchurch.church/" />
    <meta property="og:image" content="https://www.hpcchurch.church/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="His Place Community Church" />
    <meta name="twitter:description" content="A Bible based, Jesus following church serving Amelia, Beechmont, Cherry Grove, Bethel, and the State Route 125 area." />
    <meta name="twitter:image" content="https://www.hpcchurch.church/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
